<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Editor — estilo Word</title>
<style>
  :root{
    --bg:#0f141a; --panel:#161c23; --ink:#e7eef7; --muted:#9fb0c6;
    --paper:#ffffff; --paper-ink:#0b1220; --brand:#2f7df6; --brand-2:#1fb888;
    --border:#e5ebf3; --shadow:0 8px 32px rgba(0,0,0,.12);
    --btn:#f6f8fb; --btn-ink:#0c1321; --btn-active:#e6efff; --btn-bd:#d5dfec;
    --touch:44px;
  }
  /* Dark mode toggled on body.dark */
  body.dark{
    --bg:#0a0f14; --panel:#0f151c; --ink:#dbe6f5; --muted:#86a0bf;
    --paper:#121821; --paper-ink:#e9f1fb; --border:#1e2733;
    --btn:#12202e; --btn-ink:#dbe6f5; --btn-active:#182a40; --btn-bd:#1b2735;
    --shadow:0 8px 32px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial;
  }

  .wrap{display:flex; flex-direction:column; min-height:100%}
  header{
    position:sticky; top:0; z-index:50; backdrop-filter:saturate(1.2) blur(6px);
    background:color-mix(in srgb, var(--panel) 90%, transparent);
    border-bottom:1px solid var(--border); box-shadow:var(--shadow);
  }
  .toolbar{
    display:flex; flex-wrap:wrap; gap:.5rem; padding:.5rem; max-width:1100px; margin:0 auto;
    align-items:center; justify-content:flex-start;
  }
  .toolbar .group{
    display:flex; flex-wrap:wrap; gap:.35rem; padding:.25rem .35rem; border:1px solid var(--btn-bd); border-radius:12px; background:var(--panel);
  }
  button, select, input[type="color"]{
    height:var(--touch); min-width:var(--touch); border:1px solid var(--btn-bd);
    background:var(--btn); color:var(--btn-ink); border-radius:10px; padding:.4rem .6rem; cursor:pointer;
    font:600 14px/1 system-ui; box-shadow:none; outline-offset:2px;
  }
  select{padding-right:1.8rem}
  input[type="color"]{padding:0 .2rem; width:var(--touch)}
  button:hover{background:color-mix(in srgb, var(--btn) 70%, white)}
  button.active{background:var(--btn-active); border-color:var(--brand)}
  button .icon{font-size:16px}

  .brand{
    font-weight:800; letter-spacing:.2px; color:var(--ink); padding:.25rem .6rem; margin-right:.4rem;
  }
  .spacer{flex:1}

  /* Editor area (folha) */
  main{flex:1; display:flex}
  .stage{width:100%; max-width:1100px; margin:16px auto; padding:0 12px}
  .page{
    background:var(--paper); color:var(--paper-ink);
    min-height:70vh; padding:28mm 22mm; border:1px solid var(--border);
    border-radius:14px; box-shadow:var(--shadow);
  }
  .page:focus{outline:none}

  /* Tipografia base do documento */
  .page{font: 16px/1.6 "Segoe UI", Roboto, Arial, system-ui}
  .page h1{font-size:2.2rem; margin:0 0 .6rem}
  .page h2{font-size:1.8rem; margin:1.2rem 0 .4rem}
  .page h3{font-size:1.4rem; margin:1rem 0 .3rem}
  .page p{margin:.5rem 0}
  .page img{max-width:100%; height:auto; border-radius:8px}
  .page blockquote{
    border-left:4px solid #9ac1ff55; margin:1rem 0; padding:.5rem 1rem; color:#3a4a63;
    background: #eaf2ff66; border-radius:8px;
  }

  /* Status bar */
  .status{
    max-width:1100px; margin:6px auto 16px; color:var(--muted);
    display:flex; gap:1rem; align-items:center; padding:0 12px; font-size:.95rem;
  }

  /* Mobile tweaks */
  @media (max-width: 720px){
    .page{padding:18mm 14mm; border-radius:12px}
    .toolbar{gap:.4rem}
    button, select{min-width:unset}
    .brand{display:none}
  }

  /* Print: remove chrome, imprimir só o conteúdo */
  @media print{
    header, .status{display:none !important}
    body{background:#fff}
    .stage{max-width:none; margin:0; padding:0}
    .page{border:none; box-shadow:none; min-height:auto; padding:15mm 18mm}
  }

  /* Toast */
  .toast{
    position:fixed; bottom:16px; right:16px; background:#111a;
    color:#fff; padding:.6rem .8rem; border-radius:10px; backdrop-filter:blur(6px);
    opacity:0; transform:translateY(8px); transition:.25s; z-index:99
  }
  .toast.show{opacity:1; transform:translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="toolbar" role="toolbar" aria-label="Ferramentas do editor">
      <div class="brand">Editor</div>

      <div class="group" aria-label="Arquivo">
        <button id="newDoc" title="Novo (Ctrl+N)">Novo</button>
        <button id="openFile" title="Abrir arquivo HTML/TXT">Abrir</button>
        <button id="saveDoc" title="Exportar .DOC (Ctrl+S)">Salvar .DOC</button>
        <button id="exportHTML" title="Exportar HTML">Exportar HTML</button>
        <button id="printDoc" title="Imprimir / PDF">Imprimir</button>
      </div>

      <div class="group" aria-label="Formato">
        <select id="blockFormat" title="Estilo do parágrafo">
          <option value="p">Parágrafo</option>
          <option value="h1">Título 1</option>
          <option value="h2">Título 2</option>
          <option value="h3">Título 3</option>
        </select>
        <button data-cmd="bold" title="Negrito (Ctrl+B)"><span class="icon">B</span></button>
        <button data-cmd="italic" title="Itálico (Ctrl+I)"><span class="icon"><i>I</i></span></button>
        <button data-cmd="underline" title="Sublinhado (Ctrl+U)"><span class="icon"><u>U</u></span></button>
        <button data-cmd="strikeThrough" title="Tachado"><span class="icon">S̶</span></button>
        <button id="clearFormat" title="Limpar formatação">Limpar</button>
      </div>

      <div class="group" aria-label="Fonte/Cor">
        <select id="fontName" title="Fonte">
          <option value="inherit">Padrão</option>
          <option>Arial</option><option>Georgia</option><option>"Times New Roman"</option>
          <option>Verdana</option><option>Tahoma</option><option>"Courier New"</option>
        </select>
        <select id="fontSize" title="Tamanho da fonte">
          <option value="0">Tamanho</option>
          <option value="2">Pequeno</option>
          <option value="3" selected>Médio</option>
          <option value="4">Grande</option>
          <option value="5">Muito grande</option>
          <option value="6">Enorme</option>
        </select>
        <label style="display:flex; align-items:center; gap:.35rem">
          <span style="font-size:.9rem;color:var(--muted)">Texto</span>
          <input type="color" id="foreColor" value="#0b1220" title="Cor do texto" />
        </label>
        <label style="display:flex; align-items:center; gap:.35rem">
          <span style="font-size:.9rem;color:var(--muted)">Realce</span>
          <input type="color" id="hiliteColor" value="#fff59d" title="Marca-texto" />
        </label>
      </div>

      <div class="group" aria-label="Parágrafo">
        <button data-cmd="justifyLeft" title="Alinhar à esquerda">⟸</button>
        <button data-cmd="justifyCenter" title="Centralizar">╋</button>
        <button data-cmd="justifyRight" title="Alinhar à direita">⟹</button>
        <button data-cmd="justifyFull" title="Justificar">≋</button>
        <button data-cmd="insertUnorderedList" title="Lista •">• Lista</button>
        <button data-cmd="insertOrderedList" title="Lista 1.">1. Lista</button>
        <button data-cmd="outdent" title="Recuar">↤</button>
        <button data-cmd="indent" title="Avançar">↦</button>
        <button id="quote" title="Citação">“ ”</button>
      </div>

      <div class="group" aria-label="Inserir">
        <button id="insertLink" title="Inserir link">Link</button>
        <button id="insertImg" title="Inserir imagem">Img</button>
      </div>

      <div class="group" aria-label="Edição">
        <button data-cmd="undo" title="Desfazer (Ctrl+Z)">↶</button>
        <button data-cmd="redo" title="Refazer (Ctrl+Y)">↷</button>
        <button id="findBtn" title="Buscar (Ctrl+F do navegador já funciona)">Buscar</button>
        <button id="replaceBtn" title="Substituir">Substituir</button>
      </div>

      <div class="spacer"></div>

      <div class="group" aria-label="Preferências">
        <button id="darkToggle" title="Modo escuro/claro">🌙/☀️</button>
        <label style="display:flex;align-items:center;gap:.35rem;padding-right:.2rem">
          <input type="checkbox" id="autosaveToggle" checked />
          <span style="font-size:.9rem;color:var(--muted)">Autosave</span>
        </label>
      </div>

      <input id="hiddenFile" type="file" accept=".html,.htm,.txt" hidden />
      <input id="hiddenImage" type="file" accept="image/*" hidden />
    </div>
  </header>

  <main>
    <div class="stage">
      <div id="editor" class="page" contenteditable="true" spellcheck="true">
        <h1>Título do Documento</h1>
        <p><em>Dica:</em> este editor salva automaticamente no seu navegador. Você pode exportar como <strong>.DOC</strong> (abre no Word), imprimir em PDF, inserir imagens, links, listas, citações e muito mais.</p>
        <p>Comece a digitar aqui…</p>
      </div>
      <div class="status" id="status">
        <div id="wordCount">0 palavras</div>
        <div id="charCount">0 caracteres</div>
        <div id="readTime">0 min de leitura</div>
        <div id="savedState">—</div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const editor = document.getElementById('editor');
  const toast = document.getElementById('toast');
  const statusW = document.getElementById('wordCount');
  const statusC = document.getElementById('charCount');
  const statusR = document.getElementById('readTime');
  const savedState = document.getElementById('savedState');

  const AUTOSAVE_KEY = 'richword.autosave.v1';
  const THEME_KEY = 'richword.theme';
  let autosaveOn = true;
  let saveTimer = null;

  // Helpers
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 1600);
  }
  function cmd(command, value=null){
    document.execCommand(command, false, value);
    editor.focus();
    refreshState();
  }
  function sanitizeHTML(html){
    // bem simples: remove scripts/eventos por segurança
    return html.replace(/<script[\s\S]*?<\/script>/gi,'')
               .replace(/\son\w+="[^"]*"/gi,'')
               .replace(/\son\w+='[^']*'/gi,'');
  }

  // Toolbar binding (delegação)
  document.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-cmd]');
    if(btn){
      e.preventDefault();
      cmd(btn.dataset.cmd);
    }
  });

  // Formato de bloco (p/h1/h2/h3)
  document.getElementById('blockFormat').addEventListener('change', e=>{
    const tag = e.target.value;
    if(tag === 'p'){ cmd('formatBlock', 'P'); }
    else cmd('formatBlock', tag.toUpperCase());
  });

  // Fonte e tamanho (usa execCommand por compat)
  document.getElementById('fontName').addEventListener('change', e=>{
    const val = e.target.value;
    if(val === 'inherit'){ return; }
    cmd('fontName', val);
  });
  document.getElementById('fontSize').addEventListener('change', e=>{
    const val = e.target.value;
    if(val !== '0') cmd('fontSize', val); // 1-7
  });

  // Cores
  document.getElementById('foreColor').addEventListener('input', e=>{
    cmd('foreColor', e.target.value);
  });
  document.getElementById('hiliteColor').addEventListener('input', e=>{
    // Alguns browsers usam 'backColor' em vez de 'hiliteColor'
    if(document.queryCommandSupported('hiliteColor')) cmd('hiliteColor', e.target.value);
    else cmd('backColor', e.target.value);
  });

  // Citação elegante
  document.getElementById('quote').addEventListener('click', ()=>{
    const html = '<blockquote>Texto da citação…</blockquote>';
    insertHTMLAtCaret(html);
  });

  // Limpar formatação
  document.getElementById('clearFormat').addEventListener('click', ()=>{
    cmd('removeFormat'); cmd('unlink');
  });

  // Inserir link
  document.getElementById('insertLink').addEventListener('click', ()=>{
    const url = prompt('URL do link (ex: https://exemplo.com):');
    if(!url) return;
    // Se nada selecionado, cria um link com o próprio texto da URL
    if(window.getSelection().isCollapsed){
      insertHTMLAtCaret(`<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>`);
    }else{
      cmd('createLink', url);
    }
  });

  // Inserir imagem (arquivo local)
  const imgInput = document.getElementById('hiddenImage');
  document.getElementById('insertImg').addEventListener('click', ()=> imgInput.click());
  imgInput.addEventListener('change', ()=>{
    const file = imgInput.files[0]; imgInput.value = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e=>{
      insertHTMLAtCaret(`<img src="${e.target.result}" alt="">`);
    };
    reader.readAsDataURL(file);
  });

  // Buscar / Substituir (simples)
  document.getElementById('findBtn').addEventListener('click', ()=>{
    const q = prompt('Buscar por:');
    if(!q) return;
    // Usa window.find; se não funcionar, apenas avisa
    if(!window.find(q, false, false, true, false, false, false)){
      showToast('Não encontrado');
    }
  });
  document.getElementById('replaceBtn').addEventListener('click', ()=>{
    const q = prompt('Substituir — procurar por:');
    if(!q) return;
    const r = prompt(`Substituir "${q}" por:`, '');
    if(r === null) return;
    replaceAllInEditor(q, r);
  });

  // Arquivo: novo/abrir/salvar/exportar/imprimir
  document.getElementById('newDoc').addEventListener('click', ()=>{
    if(editor.innerText.trim().length && !confirm('Limpar documento atual?')) return;
    editor.innerHTML = '<h1>Título do Documento</h1><p>Comece a digitar…</p>';
    persistNow();
    showToast('Novo documento');
  });

  const openInput = document.getElementById('hiddenFile');
  document.getElementById('openFile').addEventListener('click', ()=> openInput.click());
  openInput.addEventListener('change', ()=>{
    const file = openInput.files[0]; openInput.value='';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e=>{
      const text = e.target.result;
      // Se é HTML, injeta; se é TXT, converte quebras de linha para <p>
      const isHtml = /<\/?[a-z][\s\S]*>/i.test(text);
      editor.innerHTML = isHtml ? sanitizeHTML(text) : toHtmlFromTxt(text);
      persistNow();
      showToast('Arquivo carregado');
    };
    reader.readAsText(file, 'utf-8');
  });

  document.getElementById('saveDoc').addEventListener('click', ()=>{
    downloadDocFile();
  });
  document.getElementById('exportHTML').addEventListener('click', ()=>{
    const html = wrapAsStandaloneHTML(editor.innerHTML);
    downloadBlob(html, 'text/html', 'documento.html');
  });
  document.getElementById('printDoc').addEventListener('click', ()=> window.print());

  // Preferências
  const autosaveToggle = document.getElementById('autosaveToggle');
  autosaveToggle.addEventListener('change', ()=>{
    autosaveOn = autosaveToggle.checked;
    if(autosaveOn) persistNow();
    savedState.textContent = autosaveOn ? 'Autosave ligado' : 'Autosave desligado';
  });

  const darkToggle = document.getElementById('darkToggle');
  darkToggle.addEventListener('click', ()=>{
    document.body.classList.toggle('dark');
    localStorage.setItem(THEME_KEY, document.body.classList.contains('dark')?'dark':'light');
  });

  // Inserção HTML no caret
  function insertHTMLAtCaret(html){
    editor.focus();
    const sel = window.getSelection();
    if(!sel || sel.rangeCount === 0){
      editor.insertAdjacentHTML('beforeend', html);
      return;
    }
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const frag = range.createContextualFragment(html);
    const lastNode = frag.lastChild;
    range.insertNode(frag);
    // mover caret para depois do que foi inserido
    if(lastNode){
      const r = document.createRange();
      r.setStartAfter(lastNode); r.collapse(true);
      sel.removeAllRanges(); sel.addRange(r);
    }
  }

  // Replace all simples (não sensível a HTML; atua em innerHTML com segurança básica)
  function replaceAllInEditor(findStr, replaceStr){
    const esc = findStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(esc, 'g');
    editor.innerHTML = sanitizeHTML(editor.innerHTML).replace(re, escapeHtml(replaceStr));
    persistNow();
    showToast('Substituição concluída');
  }

  function toHtmlFromTxt(txt){
    const safe = escapeHtml(txt).split(/\r?\n\r?\n/).map(p=>`<p>${p.replace(/\r?\n/g,'<br>')}</p>`).join('');
    return safe || '<p></p>';
  }
  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Exportar .DOC: Word abre HTML com este MIME
  function downloadDocFile(){
    const docHTML = `
<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office"
      xmlns:w="urn:schemas-microsoft-com:office:word"
      xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8">
  <title>Documento</title>
  <style>
    body{font-family:"Times New Roman",serif; color:#111; line-height:1.5}
    img{max-width:100%; height:auto}
    blockquote{border-left:4px solid #9ac1ff; padding:.5rem 1rem; background:#eef5ff}
    h1{font-size:28pt} h2{font-size:22pt} h3{font-size:18pt}
    p{font-size:12pt}
  </style>
</head>
<body>${editor.innerHTML}</body></html>`;
    downloadBlob(docHTML, 'application/msword', 'documento.doc');
  }
  function wrapAsStandaloneHTML(inner){
    return `<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documento exportado</title>
<style>body{font:16px/1.6 Segoe UI, Roboto, Arial; color:#0b1220; padding:28mm 22mm; background:#fff}
img{max-width:100%;height:auto} blockquote{border-left:4px solid #9ac1ff; padding:.5rem 1rem; background:#eef5ff}
h1{font-size:2.2rem} h2{font-size:1.8rem} h3{font-size:1.4rem}
</style></head><body>${inner}</body></html>`;
  }
  function downloadBlob(content, mime, filename){
    const blob = new Blob([content], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    a.remove(); URL.revokeObjectURL(url);
  }

  // Status: contagem
  function refreshState(){
    const text = editor.innerText || '';
    const words = (text.trim().match(/\S+/g)||[]).length;
    const chars = text.replace(/\s/g,'').length;
    const mins = Math.max(1, Math.ceil(words/200));
    statusW.textContent = `${words} palavra${words===1?'':'s'}`;
    statusC.textContent = `${chars} caractere${chars===1?'':'s'}`;
    statusR.textContent = `${mins} min de leitura`;
  }

  // Autosave
  function persistNow(){
    if(!autosaveOn) return;
    localStorage.setItem(AUTOSAVE_KEY, editor.innerHTML);
    savedState.textContent = 'Salvo';
  }
  editor.addEventListener('input', ()=>{
    refreshState();
    savedState.textContent = 'Editando…';
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{ persistNow(); showToast('Salvo'); }, 1000);
  });

  // Ativa/Desativa botões conforme seleção
  function updateActiveButtons(){
    const map = ['bold','italic','underline','strikeThrough','justifyLeft','justifyCenter','justifyRight','justifyFull'];
    map.forEach(cmdName=>{
      document.querySelectorAll(`button[data-cmd="${cmdName}"]`).forEach(btn=>{
        try{ btn.classList.toggle('active', document.queryCommandState(cmdName)); }catch{}
      });
    });
  }
  document.addEventListener('selectionchange', ()=>{
    if(document.activeElement === editor || editor.contains(document.activeElement)){
      updateActiveButtons();
    }
  });

  // Atalhos
  document.addEventListener('keydown', (e)=>{
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='s'){
      e.preventDefault(); downloadDocFile();
    }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='n'){
      e.preventDefault(); document.getElementById('newDoc').click();
    }
  });

  // Restaurar tema + autosave
  (function init(){
    const theme = localStorage.getItem(THEME_KEY);
    if(theme === 'dark') document.body.classList.add('dark');

    const saved = localStorage.getItem(AUTOSAVE_KEY);
    if(saved){
      editor.innerHTML = sanitizeHTML(saved);
      showToast('Documento restaurado (autosave)');
    }
    refreshState();
    savedState.textContent = 'Pronto';
  })();
})();
</script>
</body>
  </html>
