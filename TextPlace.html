<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Editor de Texto Colaborativo (sem Firebase)</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif; }
    header { padding: .6rem 1rem; background: #2563eb; color: white; display:flex; align-items:center; gap:.75rem; }
    header h1 { font-size: 1.1rem; margin: 0; }
    header small { opacity:.9 }
    #peers { margin-left:auto; background:rgba(255,255,255,.15); padding:.2rem .55rem; border-radius:999px; font-weight:600 }
    main { padding: 0; display:grid; place-items:start center; }
    #editor { padding: 1rem; min-height: 85vh; outline: none; max-width: 900px; width: min(100%, 900px); line-height:1.6; }
    #editor:empty:before { content: 'Digite aqui...'; color:#94a3b8 }
    .status { position: sticky; bottom: 0; background:#0b1220; color:#cbd5e1; padding:.4rem .75rem; font-size:.9rem; }
    code { background: rgba(0,0,0,.06); padding:.1rem .35rem; border-radius:.35rem }
  </style>
</head>
<body>
  <header>
    <h1>Editor Colaborativo</h1>
    <small>Salas por URL: use <code>#minha-sala</code></small>
    <span id="room" style="background:rgba(255,255,255,.15); padding:.2rem .55rem; border-radius:999px; font-weight:600"></span>
    <span id="peers">👥 1</span>
  </header>

  <main>
    <div id="editor" contenteditable="true"></div>
  </main>

  <div class="status">
    <span id="sync">Conectando…</span>
  </div>

  <!-- Yjs (CRDT) + y-websocket provider (servidor público de demonstração) -->
  <script type="module">
    import * as Y from "https://cdn.jsdelivr.net/npm/yjs@13.6.10/dist/yjs.mjs";
    import { WebsocketProvider } from "https://cdn.jsdelivr.net/npm/y-websocket@2.0.4/dist/y-websocket.mjs";

    const editor = document.getElementById('editor');
    const syncEl = document.getElementById('sync');
    const peersEl = document.getElementById('peers');
    const roomEl = document.getElementById('room');

    // Sala pela hash (#capitulo-1). Se não houver, usa 'default'
    const room = (location.hash.replace('#','') || 'default').toLowerCase();
    roomEl.textContent = `Sala: ${room}`;

    // Documento Yjs e tipo de texto compartilhado
    const ydoc = new Y.Doc();
    const ytext = ydoc.getText('doc');

    // Provider WebSocket (servidor público de demo). Para produção, hospede o seu próprio.
    const provider = new WebsocketProvider('wss://demos.yjs.dev', `editor-${room}`, ydoc);

    // Awareness (presença) — conta peers conectados
    const awareness = provider.awareness;
    awareness.setLocalStateField('user', { id: Math.random().toString(36).slice(2) });
    const updatePeers = () => {
      const states = Array.from(awareness.getStates().values());
      peersEl.textContent = `👥 ${states.length}`;
    };
    awareness.on('change', updatePeers);

    // Estado da conexão
    provider.on('status', (e) => {
      syncEl.textContent = e.status === 'connected' ? 'Sincronizado' : 'Reconectando…';
    });

    // Aplicar mudanças remotas no contenteditable sem loop
    let applyingRemote = false;
    const applyFromY = () => {
      applyingRemote = true;
      const html = ytext.toString();
      if (editor.innerHTML !== html) {
        // Tenta preservar posição de scroll
        const yScroll = window.scrollY;
        editor.innerHTML = html;
        window.scrollTo(0, yScroll);
      }
      applyingRemote = false;
    };

    // Inicializa editor a partir do estado atual
    applyFromY();

    // Observa mudanças do CRDT
    ytext.observe(() => applyFromY());

    // Empurra mudanças locais para o CRDT (com debounce leve)
    let t = null;
    const pushLocal = () => {
      if (applyingRemote) return;
      clearTimeout(t);
      t = setTimeout(() => {
        const html = editor.innerHTML;
        // Substitui todo o conteúdo — simples e robusto para HTML básico
        ytext.delete(0, ytext.length);
        ytext.insert(0, html);
      }, 120);
    };

    editor.addEventListener('input', pushLocal);
    editor.addEventListener('drop', (e)=> setTimeout(pushLocal, 0));
    editor.addEventListener('paste', (e)=> setTimeout(pushLocal, 0));

    // Conteúdo inicial quando a sala é criada do zero
    if (ytext.length === 0) {
      ytext.insert(0, `<h2>Bem-vindo à sala <em>${room}</em></h2><p>Edite este texto. Abra a <strong>mesma URL</strong> em outra aba ou computador para ver a colaboração em tempo real.</p>`);
    }

    // Dica: troque o hash para mudar de sala sem recarregar a página
    window.addEventListener('hashchange', () => location.reload());
  </script>
</body>
</html>
